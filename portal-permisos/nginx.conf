# Servidor del portal (imagen nginx-unprivileged, puerto 8080).
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    server_tokens off;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html cambia con cada versión: que el navegador siempre pregunte.
        add_header Cache-Control "no-cache" always;
        # El portal trae su JavaScript y su CSS dentro de index.html y sólo carga
        # las fuentes de Google; la API vive en localhost:8000.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:8000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
