global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    entorno: desarrollo

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # La API de la Ventanilla Única: "api" es el contenedor de docker compose.
  # No se lista también host.docker.internal:8000: Docker Desktop publica ese
  # mismo contenedor en el puerto 8000 del equipo, así que se leería dos veces
  # y Grafana sumaría el doble. Si corres uvicorn en tu máquina sin el
  # contenedor, cambia el objetivo a "host.docker.internal:8000".
  - job_name: ventanilla-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          municipio: panama

    # Al escalar a varios municipios sólo se agregan objetivos:
    #   - targets: ["api-san-miguelito:8000"]
    #     labels: {municipio: san-miguelito}
    #   - targets: ["api-la-chorrera:8000"]
    #     labels: {municipio: la-chorrera}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
